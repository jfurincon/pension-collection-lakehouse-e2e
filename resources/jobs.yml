# Jobs del proyecto.
#
# recaudo_mensual: el flujo completo, de los archivos al score, con compuertas de
#   calidad. El reentrenamiento del modelo es opcional (parámetro reentrenar).
# recaudo_inicializacion: levanta un ambiente vacío (catálogo, datos) y luego
#   corre el flujo mensual con reentrenamiento, porque al principio no hay modelo.
resources:
  jobs:
    recaudo_mensual:
      name: recaudo_mensual
      description: >-
        Ingesta Bronze, pipelines Silver y Gold, compuertas de calidad, features,
        reentrenamiento opcional, scoring ml-v1, metric views y herramientas del agente.
      max_concurrent_runs: 1
      parameters:
        - name: reentrenar
          default: "false"
      schedule:
        # Día 3 de cada mes a las 6:00, cuando ya llegaron los pagos del periodo.
        # En pausa: los datos son sintéticos y no llegan archivos nuevos.
        quartz_cron_expression: "0 0 6 3 * ?"
        timezone_id: America/Bogota
        pause_status: PAUSED
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze_autoloader.py
            base_parameters:
              catalogo: ${var.catalogo}
              landing: /Volumes/${var.catalogo}/raw/landing

        - task_key: silver
          depends_on: [{task_key: bronze}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_recaudo.id}

        - task_key: verificar_silver
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../notebooks/02_silver_verificacion.py
            base_parameters: {catalogo: "${var.catalogo}"}

        - task_key: gold
          depends_on: [{task_key: verificar_silver}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_recaudo.id}

        - task_key: objetos_sql
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ../notebooks/07_objetos_sql.py
            base_parameters: {catalogo: "${var.catalogo}"}

        - task_key: features
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ../notebooks/04_ml_features.py
            base_parameters: {catalogo: "${var.catalogo}"}

        - task_key: decidir_reentrenamiento
          depends_on: [{task_key: features}]
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.reentrenar}}"
            right: "true"

        - task_key: entrenamiento
          depends_on: [{task_key: decidir_reentrenamiento, outcome: "true"}]
          notebook_task:
            notebook_path: ../notebooks/05_ml_entrenamiento.py
            base_parameters: {catalogo: "${var.catalogo}"}

        # Corre se haya reentrenado o no: NONE_FAILED ignora la tarea omitida.
        - task_key: scoring
          depends_on: [{task_key: entrenamiento}, {task_key: features}]
          run_if: NONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/06_ml_scoring.py
            base_parameters: {catalogo: "${var.catalogo}"}

        - task_key: gold_con_scores
          depends_on: [{task_key: scoring}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_recaudo.id}

        - task_key: verificar_gold
          depends_on: [{task_key: gold_con_scores}, {task_key: objetos_sql}]
          notebook_task:
            notebook_path: ../notebooks/03_gold_verificacion.py
            base_parameters: {catalogo: "${var.catalogo}"}

    recaudo_inicializacion:
      name: recaudo_inicializacion
      description: >-
        Levanta un ambiente desde cero: catálogo, esquemas, Volume y datos sintéticos.
        Después corre recaudo_mensual con reentrenamiento para crear el primer modelo.
      max_concurrent_runs: 1
      tasks:
        - task_key: inicializar
          notebook_task:
            notebook_path: ../notebooks/00_inicializar.py
            base_parameters:
              catalogo: ${var.catalogo}
              escala: "1.0"
              regenerar: "no"

        - task_key: flujo_mensual
          depends_on: [{task_key: inicializar}]
          run_job_task:
            job_id: ${resources.jobs.recaudo_mensual.id}
            job_parameters:
              reentrenar: "true"
